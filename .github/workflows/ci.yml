name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest -v

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package and run the console command
        run: |
          pip install .
          specguard --version
          cd /tmp
          specguard "$GITHUB_WORKSPACE/vulnerable_api.yaml" --fail-on never > /dev/null
          set +e
          specguard "$GITHUB_WORKSPACE/vulnerable_api.yaml" > /dev/null
          test $? -eq 1

  self-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: The intentionally vulnerable sample must still produce findings
        run: |
          set +e
          python specguard.py vulnerable_api.yaml > /dev/null
          test $? -eq 1
      # Only the secure reference spec is uploaded. vulnerable_api.yaml is a
      # test fixture, and uploading it would show its deliberate flaws as
      # open alerts in the Security tab.
      - name: Lint the secure reference spec (must have zero findings)
        run: python specguard.py secure_api.yaml --format sarif --fail-on low > specguard.sarif
      - name: Upload SARIF to code scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: specguard.sarif
          category: specguard-sample
