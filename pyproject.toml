[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.2.0"
description = "A security linter for OpenAPI specifications."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
keywords = ["openapi", "api-security", "linter", "sarif"]

[project.scripts]
specguard = "specguard:main"

[tool.setuptools]
py-modules = ["specguard"]
